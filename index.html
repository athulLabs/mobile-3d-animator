<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Animator</title>

  <style>
    body {
      margin: 0;
      padding: 12px;
      background: #080b16;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 600px;
      margin: auto;
    }

    .card {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #111827;
    }

    h1 {
      font-size: 19px;
      margin: 0;
    }

    h2 {
      font-size: 15px;
    }

    p {
      color: #a5b4fc;
      font-size: 12px;
    }

    #scene {
      height: 380px;
      overflow: hidden;
      border-radius: 14px;
      background: #263451;
      touch-action: none;
    }

    button {
      margin: 4px 2px;
      padding: 11px 14px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: #334155;
    }

    button.primary {
      background: #7044d8;
    }

    input {
      width: 100%;
      accent-color: #8b5cf6;
    }

    label {
      display: block;
      margin-top: 14px;
      color: #cbd5e1;
      font-size: 12px;
    }

    #message {
      text-align: center;
      color: #a78bfa;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <main class="app">
    <section class="card">
      <h1>Animated Studio</h1>
      <p>Real 3D mobile animator</p>
    </section>

    <section class="card">
      <div id="scene"></div>
      <button onclick="capturePose()">Capture Pose</button>
      <button class="primary" onclick="playAnimation()">Play Preview</button>
      <p id="message">Drag the model to rotate</p>
    </section>

    <section class="card">
      <h2>Character Workshop</h2>

      <label>Height</label>
      <input id="height" type="range" min="70" max="140" value="100"
             oninput="updateCharacter()">

      <label>Muscularity</label>
      <input id="muscle" type="range" min="70" max="140" value="100"
             oninput="updateCharacter()">

      <label>Rotation</label>
      <input id="rotation" type="range" min="-180" max="180" value="0"
             oninput="updateRotation()">

      <button onclick="saveProject()">Save Project</button>
      <button onclick="loadProject()">Load Project</button>
    </section>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from
      "three/addons/controls/OrbitControls.js";

    const container = document.getElementById("scene");
    const message = document.getElementById("message");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#263451");

    const camera = new THREE.PerspectiveCamera(
      45,
      container.clientWidth / container.clientHeight,
      0.1,
      100
    );

    camera.position.set(0, 1.5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enablePan = false;
    controls.enableDamping = true;
    controls.target.set(0, 1, 0);

    scene.add(new THREE.HemisphereLight("#ffffff", "#263451", 2));

    const light = new THREE.DirectionalLight("#ffffff", 3);
    light.position.set(4, 6, 5);
    light.castShadow = true;
    scene.add(light);

    const character = new THREE.Group();
    scene.add(character);

    const skin = new THREE.MeshStandardMaterial({ color: "#e6ad98" });
    const clothes = new THREE.MeshStandardMaterial({ color: "#9b82d6" });

    function capsule(radius, length, material) {
      const mesh = new THREE.Mesh(
        new THREE.CapsuleGeometry(radius, length, 8, 20),
        material
      );
      mesh.castShadow = true;
      return mesh;
    }

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.38, 24, 24),
      skin
    );
    head.position.y = 1.8;
    character.add(head);

    const body = capsule(0.5, 0.8, clothes);
    body.position.y = 0.8;
    character.add(body);

    const leftArm = capsule(0.13, 0.85, skin);
    leftArm.position.set(-0.7, 0.75, 0);
    character.add(leftArm);

    const rightArm = capsule(0.13, 0.85, skin);
    rightArm.position.set(0.7, 0.75, 0);
    character.add(rightArm);

    const leftLeg = capsule(0.17, 0.85, skin);
    leftLeg.position.set(-0.25, -0.45, 0);
    character.add(leftLeg);

    const rightLeg = capsule(0.17, 0.85, skin);
    rightLeg.position.set(0.25, -0.45, 0);
    character.add(rightLeg);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(2, 32),
      new THREE.MeshStandardMaterial({ color: "#111827" })
    );

    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1;
    scene.add(floor);

    let playing = false;
    let time = 0;

    window.updateCharacter = function () {
      const height = Number(document.getElementById("height").value) / 100;
      const muscle = Number(document.getElementById("muscle").value) / 100;
      character.scale.set(muscle, height, muscle);
    };

    window.updateRotation = function () {
      const degrees = Number(document.getElementById("rotation").value);
      character.rotation.y = THREE.MathUtils.degToRad(degrees);
    };

    window.capturePose = function () {
      playing = false;
      message.textContent = "Pose captured";
    };

    window.playAnimation = function () {
      playing = true;
      message.textContent = "Playing 3D animation";
    };

    window.saveProject = function () {
      const data = {
        height: height.value,
        muscle: muscle.value,
        rotation: rotation.value
      };

      localStorage.setItem("animatorProject", JSON.stringify(data));
      message.textContent = "Project saved";
    };

    window.loadProject = function () {
      const data = JSON.parse(
        localStorage.getItem("animatorProject") || "null"
      );

      if (!data) {
        message.textContent = "No saved project";
        return;
      }

      height.value = data.height;
      muscle.value = data.muscle;
      rotation.value = data.rotation;

      updateCharacter();
      updateRotation();
      message.textContent = "Project loaded";
    };

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      if (playing) {
        time += 0.08;
        leftArm.rotation.z = Math.sin(time) * 0.5;
        rightArm.rotation.z = -Math.sin(time) * 0.5;
        character.position.y = Math.abs(Math.sin(time * 2)) * 0.08;
      }

      renderer.render(scene, camera);
    }

    function resize() {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    window.addEventListener("resize", resize);

    updateCharacter();
    animate();
  </script>
</body>
</html>
